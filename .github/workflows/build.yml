name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug + unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Runner ubuntu-latest sudah menyertakan Android SDK, jadi kita tinggal
      # memastikan variabel lingkungan & lisensi siap (tanpa aksi pihak ketiga
      # yang bergantung pada runtime Node lama).
      - name: Siapkan Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK -> $SDK"
          ls "$SDK" || true
          echo "platforms:"; ls "$SDK/platforms" 2>/dev/null || true
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Pastikan Gradle wrapper tersedia
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      # Semua keluaran Gradle disimpan ke build.log supaya bisa diringkas
      # otomatis di komentar PR kalau build gagal (lihat langkah terakhir).
      - name: Unit test
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee build.log

      - name: Build APK debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a build.log

      - name: Bangun keystore debug yang stabil (opsional)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/retrobit.jks" \
            -alias retrobit -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD || 'retrobit-ci' }}" \
            -keypass "${{ secrets.KEY_PASSWORD || 'retrobit-ci' }}" \
            -dname "CN=Retrobit Voice, OU=CI, O=Retrobit, L=Jepara, C=ID"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/retrobit.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD || 'retrobit-ci' }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=retrobit" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'retrobit-ci' }}" >> "$GITHUB_ENV"

      - name: Build APK rilis (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew assembleRelease --stacktrace

      - name: Unggah APK debug
        uses: actions/upload-artifact@v4
        with:
          name: retrobit-voice-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Unggah APK rilis (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: retrobit-voice-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Ringkasan error ke komentar PR (bila gagal)
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### ❌ Build gagal"
            echo
            echo '```text'
            grep -n "^e: \| error: \|FAILED\|Execution failed\|Caused by" build.log 2>/dev/null | head -n 60 || true
            echo
            echo "--- 80 baris terakhir ---"
            tail -n 80 build.log 2>/dev/null || echo "(build.log tidak ada)"
            echo '```'
          } > /tmp/failure-comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/failure-comment.md || true

      - name: Lampirkan APK ke Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
