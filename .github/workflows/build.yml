name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug + unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Pastikan Gradle wrapper tersedia
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Unit test
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build APK debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Bangun keystore debug yang stabil (opsional)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/retrobit.jks" \
            -alias retrobit -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD || 'retrobit-ci' }}" \
            -keypass "${{ secrets.KEY_PASSWORD || 'retrobit-ci' }}" \
            -dname "CN=Retrobit Voice, OU=CI, O=Retrobit, L=Jepara, C=ID"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/retrobit.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD || 'retrobit-ci' }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=retrobit" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'retrobit-ci' }}" >> "$GITHUB_ENV"

      - name: Build APK rilis (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew assembleRelease --stacktrace

      - name: Unggah APK debug
        uses: actions/upload-artifact@v4
        with:
          name: retrobit-voice-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Unggah APK rilis (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: retrobit-voice-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Lampirkan APK ke Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
