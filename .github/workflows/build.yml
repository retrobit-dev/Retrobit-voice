name: Build APK

# Semua pembangunan APK dilakukan di GitHub Actions.
# - PR / push ke main / manual : unit test + APK debug (artifact)
# - PR, push ke main, dan tag  : APK rilis ber-tanda tangan (artifact)
# - Push ke main                : Release "build-terbaru"
# - Tag v*                      : Release resmi dengan catatan rilis
# Push feature branch tanpa PR tidak membangun duplikat; gunakan workflow_dispatch bila perlu.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Batalkan build lama pada ref/PR yang sama saat commit baru datang.
concurrency:
  group: retrobit-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

# Proyek ini sengaja TIDAK menyimpan keystore permanen (keputusan pemilik proyek).
# Setiap build membuat kunci sekali pakai di runner — lihat langkah "Siapkan keystore".
# Akibatnya tanda tangan APK berbeda di tiap build dan memasang versi baru selalu
# memerlukan uninstall dulu (detail di README bagian "Unduh APK").
# Kalau kelak ingin update menimpa tanpa uninstall, simpan satu keystore tetap
# sebagai secret lalu pulihkan (base64 -d) di langkah tersebut.
env:
  KEYSTORE_PASSWORD: retrobit-ci-pass
  KEY_PASSWORD: retrobit-ci-pass
  KEY_ALIAS: retrobit

jobs:
  build:
    name: Test + APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Runner ubuntu-latest sudah menyertakan Android SDK, jadi kita tinggal
      # memastikan variabel lingkungan & lisensi siap (tanpa aksi pihak ketiga
      # yang bergantung pada runtime Node lama).
      - name: Siapkan Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK -> $SDK"
          ls "$SDK" || true
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Pastikan Gradle wrapper tersedia
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Unit test
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee build.log

      # Penjaga regresi yang tidak terlihat unit test (mis. API tanpa cek versi,
      # resource hilang). abortOnError = true di app/build.gradle.kts membuat
      # temuan bertingkat error menggagalkan langkah ini.
      - name: Lint (error menggagalkan build)
        run: |
          set -o pipefail
          ./gradlew lintDebug --stacktrace 2>&1 | tee -a build.log

      - name: Build APK debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a build.log

      # ---------- APK rilis ber-tanda tangan (PR, main & tag) ----------
      # Kunci dibuat SEKALI PAKAI di runner, bukan dipulihkan dari secret: proyek ini
      # tidak menyimpan keystore permanen. Cukup untuk dipasang & diuji, tetapi setiap
      # build punya tanda tangan berbeda sehingga tidak bisa menimpa versi lama.
      - name: Siapkan keystore sekali pakai (kunci uji)
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/retrobit.jks" \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname "CN=Retrobit Voice, OU=Release, O=Retrobit, L=Jepara, C=ID"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/retrobit.jks" >> "$GITHUB_ENV"

      - name: Build APK rilis
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee -a build.log

      - name: Verifikasi tanda tangan APK rilis
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Unggah APK debug (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: retrobit-voice-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Unggah APK rilis (artifact)
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: retrobit-voice-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Catat versi aplikasi
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        id: appver
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Release "build-terbaru": APK siap unduh TANPA perlu login GitHub.
      - name: Release build-terbaru (dari main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-terbaru
          name: Build terbaru (${{ steps.appver.outputs.version }})
          body: |
            APK terbaru dari branch `main` — commit ${{ github.sha }}.

            | Berkas | Kegunaan |
            | --- | --- |
            | `app-release.apk` | Rilis (lebih kecil & lebih cepat, sudah diminifikasi) |
            | `app-debug.apk` | Debug (untuk melaporkan masalah dengan log lengkap) |

            > ⚠️ **Uninstall versi lama dulu sebelum memasang.**
            > Proyek ini tidak menyimpan keystore tetap, jadi setiap build ditandatangani
            > kunci sekali pakai dan Android menolak pemasangan yang menimpa versi lama
            > (`INSTALL_FAILED_UPDATE_INCOMPATIBLE`).
            > Uninstall juga menghapus setelan & API key yang tersimpan — jalankan
            > **Pengaturan → Cadangan setelan → Ekspor** sebelum mengganti versi, lalu
            > **Impor** setelah versi baru terpasang.

            Cara pasang: unduh APK → **uninstall versi lama** → buka berkas di ponsel → izinkan
            "Instal dari sumber tidak dikenal" bila diminta.
            Setelah terpasang, ikuti 5 langkah aktivasi di tab **Beranda**.
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          prerelease: true
          make_latest: true

      # Release resmi untuk tag v*
      - name: Release resmi (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          make_latest: true

      - name: Ringkasan error ke komentar PR (bila gagal)
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### ❌ Build gagal"
            echo
            echo '```text'
            grep -n "^e: \| error: \|Error: \|FAILED\|Execution failed\|Caused by" build.log 2>/dev/null | head -n 60 || true
            echo
            echo "--- 80 baris terakhir ---"
            tail -n 80 build.log 2>/dev/null || echo "(build.log tidak ada)"
            echo '```'

            # Temuan Lint lengkap. Tanpa ini, gerbang Lint hanya memberi tahu bahwa
            # build gagal — daftar temuannya tersembunyi di berkas laporan artefak.
            if [ -f app/build/reports/lint-results-debug.txt ]; then
              echo
              echo "### 🔎 Temuan Lint"
              echo
              echo '```text'
              grep -nE "Error:|Warning:" app/build/reports/lint-results-debug.txt | head -n 80 || true
              echo '```'
            fi
          } > /tmp/failure-comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/failure-comment.md || true
